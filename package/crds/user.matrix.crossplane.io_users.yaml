---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: users.user.matrix.crossplane.io
spec:
  group: user.matrix.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - matrix
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A User is a managed resource that represents a Matrix User
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A UserSpec defines the desired state of a User.
            properties:
              forProvider:
                description: UserParameters define the desired state of a Matrix User
                properties:
                  admin:
                    default: false
                    description: Admin indicates if the user should have server admin
                      privileges
                    type: boolean
                  avatarURL:
                    description: AvatarURL is the user's avatar URL (mxc:// URL)
                    pattern: ^mxc://.*
                    type: string
                  deactivated:
                    default: false
                    description: Deactivated indicates if the user account should
                      be deactivated
                    type: boolean
                  displayName:
                    description: DisplayName is the user's display name
                    type: string
                  expireTime:
                    description: ExpireTime is when the user account expires (for
                      guest users)
                    format: date-time
                    type: string
                  externalIDs:
                    description: ExternalIDs are third-party identifiers (3PIDs) associated
                      with the user
                    items:
                      description: ExternalID represents a third-party identifier
                        associated with a user
                      properties:
                        address:
                          description: Address is the actual identifier value
                          type: string
                        medium:
                          description: Medium is the type of identifier (email, msisdn)
                          enum:
                          - email
                          - msisdn
                          type: string
                        validated:
                          default: false
                          description: Validated indicates if the identifier has been
                            validated
                          type: boolean
                      required:
                      - address
                      - medium
                      type: object
                    type: array
                  localpart:
                    description: |-
                      Localpart is the local part of the Matrix user ID (before the @)
                      Required if UserID is not provided
                    pattern: ^[a-zA-Z0-9._=/-]+$
                    type: string
                  password:
                    description: |-
                      Password for the user account. Will be auto-generated if not provided.
                      Note: Use passwordSecretRef for secure password management
                    type: string
                  passwordSecretRef:
                    description: PasswordSecretRef references a Secret containing
                      the user password
                    properties:
                      key:
                        description: The key to select.
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  userID:
                    description: |-
                      UserID is the Matrix user ID (e.g., @alice:example.com)
                      If not provided, will be generated from localpart and homeserver domain
                    pattern: ^@[a-zA-Z0-9._=/-]+:[a-zA-Z0-9.-]+$
                    type: string
                  userType:
                    default: regular
                    description: UserType specifies the type of user account
                    enum:
                    - regular
                    - guest
                    - support
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A UserStatus represents the observed state of a User.
            properties:
              atProvider:
                description: UserObservation reflects the observed state of a Matrix
                  User
                properties:
                  admin:
                    description: Admin indicates if the user has admin privileges
                    type: boolean
                  avatarURL:
                    description: AvatarURL is the current avatar URL
                    type: string
                  creationTime:
                    description: CreationTime is when the user was created
                    format: date-time
                    type: string
                  deactivated:
                    description: Deactivated indicates if the user is deactivated
                    type: boolean
                  devices:
                    description: Devices is a list of devices associated with the
                      user
                    items:
                      description: Device represents a Matrix device
                      properties:
                        deviceID:
                          description: DeviceID is the unique device identifier
                          type: string
                        displayName:
                          description: DisplayName is the device display name
                          type: string
                        lastSeenIP:
                          description: LastSeenIP is the last IP address the device
                            was seen from
                          type: string
                        lastSeenTime:
                          description: LastSeenTime is when the device was last seen
                          format: date-time
                          type: string
                      type: object
                    type: array
                  displayName:
                    description: DisplayName is the current display name
                    type: string
                  externalIDs:
                    description: ExternalIDs are the validated external identifiers
                    items:
                      description: ExternalID represents a third-party identifier
                        associated with a user
                      properties:
                        address:
                          description: Address is the actual identifier value
                          type: string
                        medium:
                          description: Medium is the type of identifier (email, msisdn)
                          enum:
                          - email
                          - msisdn
                          type: string
                        validated:
                          default: false
                          description: Validated indicates if the identifier has been
                            validated
                          type: boolean
                      required:
                      - address
                      - medium
                      type: object
                    type: array
                  lastSeenTime:
                    description: LastSeenTime is when the user was last seen
                    format: date-time
                    type: string
                  shadowBanned:
                    description: ShadowBanned indicates if the user is shadow banned
                    type: boolean
                  userID:
                    description: UserID is the full Matrix user ID
                    type: string
                  userType:
                    description: UserType is the type of user account
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
