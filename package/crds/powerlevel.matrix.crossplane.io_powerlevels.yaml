                  ban:
                    description: Ban is the current power level required to ban users
                    type: integer
                  events:
                    additionalProperties:
                      type: integer
                    description: Events contains the current event type power levels
                    type: object
                  eventsDefault:
                    description: EventsDefault is the current default power level
