                    type: integer
                  roomID:
                    description: RoomID is the Matrix room ID
                    type: string
                  stateDefault:
                    description: StateDefault is the current default power level for
                      state events
                    type: integer
                  users:
                    additionalProperties:
                      type: integer
                    description: Users contains the current user power levels
                    type: object
                  usersDefault:
                    description: UsersDefault is the current default power level for
                      users
                    type: integer
                type: object
              conditions:
